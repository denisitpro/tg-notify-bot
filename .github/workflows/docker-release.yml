name: docker-build

# Build & push the Telegram notify bot image to Docker Hub.
# Each build publishes three tags (image name is set once in env.DOCKER_IMAGE):
#   denisitpro/tg-notify-bot:TAG
#   denisitpro/tg-notify-bot:TAG_SHORTSHA   (underscore — Docker forbids '+' in tags)
#   denisitpro/tg-notify-bot:latest
#
# Publish only from git tags (and optional workflow_dispatch).
# TAG resolution:
#   workflow_dispatch version input -> TAG (strip leading v)
#   git tag refs/tags/*               -> tag name (strip leading v)
# SHORTSHA = git rev-parse --short=12 HEAD (always).
#
# Required repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  DOCKER_IMAGE: denisitpro/tg-notify-bot

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            echo "::error::docker publish runs only on git tags or workflow_dispatch" >&2
            exit 1
          fi
          if [ -z "$VERSION" ] || [ -z "$SHORT_SHA" ]; then
            echo "::error::empty image version or SHORT_SHA" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}_${{ steps.meta.outputs.short_sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
